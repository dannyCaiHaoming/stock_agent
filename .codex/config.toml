model = "gpt-6.1-sol"
sandbox_mode = "danger-full-access"
[agents]
max_threads = 4

[agents.dev_architect]
description = "OpenSpec 一致性、能力边界和架构决策。"
config_file = "agents/dev_architect.toml"

[agents.dev_contracts]
description = "版本化数据、证据、决策和追踪契约。"
config_file = "agents/dev_contracts.toml"

[agents.dev_eval]
description = "真实 Runtime 产物的独立语义评分、回归和消融验证。"
config_file = "agents/dev_eval.toml"

[agents.dev_reviewer]
description = "按日常差异、Change 验收或候选晋升目的开展只读复核。"
config_file = "agents/dev_reviewer.toml"

[sandbox_workspace_write]
network_access = true

[mcp_servers.stock_data]
command = ".venv/bin/python"
args = ["-m", "product.mcp.server"]
startup_timeout_sec = 30
tool_timeout_sec = 180
env = { SEC_USER_AGENT = "stock-agent dannycaihaoming@gmail.com" }

# save_decision only appends to the private local decision log; pre-approve it.
[mcp_servers.stock_data.tools.save_decision]
approval_mode = "approve"
