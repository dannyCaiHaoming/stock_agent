model = "gpt-6.1-sol"
sandbox_mode = "danger-full-access"
[agents]
max_threads = 4

[agents.dev_architect]
description = "OpenSpec 一致性、能力边界和架构决策。"
config_file = "agents/dev_architect.toml"

[agents.dev_contracts]
description = "版本化数据、证据、决策和追踪契约。"
config_file = "agents/dev_contracts.toml"

[agents.dev_eval]
description = "真实 Runtime 产物的独立语义评分、回归和消融验证。"
config_file = "agents/dev_eval.toml"

[agents.dev_reviewer]
description = "按日常差异、Change 验收或候选晋升目的开展只读复核。"
config_file = "agents/dev_reviewer.toml"

[sandbox_workspace_write]
network_access = true

# Native acceptance: request-bound public MRVL tools; user chose Codex first.

[agents.runtime_company_analyst]
description = "逐证券公司与基本面研究；仅任务业务工具。"
config_file = "agents/runtime_company_analyst.toml"

[agents.runtime_market_catalyst]
description = "单项市场多维研究；仅任务业务工具。"
config_file = "agents/runtime_market_catalyst.toml"

[agents.runtime_skeptic]
description = "独立首轮反证；仅原始任务资料，待实际隔离核验。"
config_file = "agents/runtime_skeptic.toml"

