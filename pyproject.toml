[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-council"
version = "0.1.0"
description = "Advisory-only stock research business tools (data sources, deterministic calculations, intake, broker read-only, trading journal)"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
live = ["yfinance==1.7.0", "akshare==1.18.94", "exchange-calendars==4.13.2", "certifi==2026.7.22", "moomoo-api==10.10.7008"]
broker-tiger = ["tigeropen==3.8.0"]

[tool.setuptools.packages.find]
include = ["product*"]

[tool.unittest]
start-directory = "tests"
